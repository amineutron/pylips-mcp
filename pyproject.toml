[project]
name = "pylips-mcp"
version = "0.1.0"
description = "MCP server for Philips TV control (JointSpace API + ADB)"
readme = "README.md"
authors = [{ name = "amineutron" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.5,<3",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "wakeonlan>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
adb = ["adb-shell>=0.4.0"]

[project.urls]
Homepage = "https://github.com/amineutron/pylips-mcp"
Issues = "https://github.com/amineutron/pylips-mcp/issues"
Repository = "https://github.com/amineutron/pylips-mcp"

[project.scripts]
pylips-mcp = "server:cli"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "tpvision_ca.pem"]

[tool.hatch.build.targets.sdist]
include = ["server.py", "README.md", "LICENSE", "config.example.yaml", "tests/", "tpvision_ca.pem"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
