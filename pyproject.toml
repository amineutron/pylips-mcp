[project]
name = "pylips-mcp"
version = "0.4.0"
description = "MCP server for Philips TV control (JointSpace API + ADB)"
readme = "README.md"
authors = [{ name = "amineutron" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "wakeonlan>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
adb = ["adb-shell>=0.4.0"]

[project.urls]
Homepage = "https://github.com/amineutron/pylips-mcp"
Issues = "https://github.com/amineutron/pylips-mcp/issues"
Repository = "https://github.com/amineutron/pylips-mcp"

[project.scripts]
pylips-mcp = "pylips_mcp.server:cli"

[tool.hatch.build.targets.wheel]
packages = ["pylips_mcp"]

[tool.hatch.build.targets.sdist]
include = ["pylips_mcp/", "server.py", "README.md", "LICENSE", "config.example.yaml", "tests/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Sélection explicite : les règles par défaut de ruff ont changé en 0.16 ; on garde les règles de base et le tri des imports.
select = ["E4", "E7", "E9", "F", "I"]
