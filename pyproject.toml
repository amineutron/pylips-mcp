[project]
name = "pylips-mcp"
version = "0.1.0"
description = "MCP server for Philips TV control (JointSpace API + ADB)"
readme = "README.md"
authors = [{ name = "amineutron" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.5.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "wakeonlan>=3.0.0",
]

[project.optional-dependencies]
adb = ["adb-shell>=0.4.0"]

[project.urls]
Homepage = "https://github.com/amineutron/pylips-mcp"
Issues = "https://github.com/amineutron/pylips-mcp/issues"
Repository = "https://github.com/amineutron/pylips-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
